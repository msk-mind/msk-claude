[project]
name = "aiportal"
version = "1.0.1"
description = "Use opencode and Claude Code with the models on MSK's AI Portal, through a local LiteLLM proxy"
readme = "README.md"
requires-python = ">=3.10"
# Pinned to the tested versions: the proxy relies on LiteLLM internals, so
# upgrade deliberately and re-test (aiportal models sync --test)
dependencies = [
    "litellm[proxy]==1.81.3",
    "requests==2.31.0",
    "urllib3==2.3.0",
    "ruamel.yaml==0.18.14",
]

[project.scripts]
aiportal = "aiportal.cli:main"
aiportal-opencode = "aiportal.launch:opencode_main"
aiportal-claude = "aiportal.launch:claude_main"

[project.urls]
Repository = "https://github.com/msk-mind/msk-claude"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiportal"]
