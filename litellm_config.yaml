litellm_settings:
  drop_params: true
  telemetry: false
  ssl_verify: false
  allowed_fails: 3
  request_timeout: 600

router_settings:
  # Regular fallbacks (for model unavailable, rate limits, etc.)
  # Note: claude-3.5-sonnet excluded due to 8192 token limit incompatibility
  fallbacks:
    - claude-sonnet-4.5: ["claude-sonnet-4", "claude-3.7-sonnet"]
    - claude-sonnet-4: ["claude-3.7-sonnet"]
    - claude-haiku-4-5-20251001: ["claude-3.7-sonnet"]
    - gpt-4.1: ["gpt-4o", "gpt-5"]
    - gpt-4o: ["gpt-4.1", "gpt-5"]
  # Content policy fallbacks (for content filtering errors)
  content_policy_fallbacks:
    - claude-sonnet-4.5: ["claude-sonnet-4", "claude-3.7-sonnet"]
    - claude-sonnet-4: ["claude-3.7-sonnet"]
    - claude-haiku-4-5-20251001: ["claude-3.7-sonnet"]
    - gpt-4.1: ["gpt-4o"]
    - gpt-4o: ["gpt-4.1"]

general_settings:
  master_key: sk-1234
