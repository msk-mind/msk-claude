litellm_settings:
  drop_params: true
  telemetry: false
  ssl_verify: false
  allowed_fails: 3
  request_timeout: 600

router_settings:
  # Each model has a single deployment, so cooldowns only replace the real
  # upstream error (e.g. an expired token) with "No deployments available"
  disable_cooldowns: true
  # Regular fallbacks (for model unavailable, rate limits, etc.)
  fallbacks:
    - claude-sonnet-5.5: ["claude-sonnet-5", "claude-sonnet-4.6", "claude-sonnet-4.5"]
    - claude-sonnet-5: ["claude-sonnet-5.5", "claude-sonnet-4.6", "claude-sonnet-4.5"]
    - claude-sonnet-4.6: ["claude-sonnet-5.5", "claude-sonnet-4.5"]
    - claude-sonnet-4.5: ["claude-sonnet-4.6", "claude-sonnet-5.5"]
    - claude-opus-5.5: ["claude-opus-5", "claude-opus-4.8"]
    - claude-opus-5: ["claude-opus-5.5", "claude-opus-4.8"]
    - claude-opus-4.8: ["claude-opus-5", "claude-opus-4.6"]
    - claude-haiku-4-5-20251001: ["claude-sonnet-5", "claude-sonnet-4.6"]
    - gpt-5.6-terra: ["gpt-5.6-luna", "gpt-5.5"]
    - gpt-5.6-luna: ["gpt-5.6-terra", "gpt-5.5"]
    - gpt-4.1: ["gpt-5"]
  # Content policy fallbacks (for content filtering errors)
  content_policy_fallbacks:
    - claude-sonnet-5.5: ["claude-sonnet-5", "claude-sonnet-4.6", "claude-sonnet-4.5"]
    - claude-sonnet-5: ["claude-sonnet-5.5", "claude-sonnet-4.6", "claude-sonnet-4.5"]
    - claude-sonnet-4.6: ["claude-sonnet-5.5", "claude-sonnet-4.5"]
    - claude-sonnet-4.5: ["claude-sonnet-4.6", "claude-sonnet-5.5"]
    - claude-opus-5.5: ["claude-opus-5", "claude-opus-4.8"]
    - claude-opus-5: ["claude-opus-5.5", "claude-opus-4.8"]
    - claude-opus-4.8: ["claude-opus-5", "claude-opus-4.6"]
    - claude-haiku-4-5-20251001: ["claude-sonnet-5", "claude-sonnet-4.6"]
    - gpt-4.1: ["gpt-5"]

general_settings:
  # Random per-user secret from .litellm_master_key (set by start_litellm.py)
  master_key: os.environ/LITELLM_MASTER_KEY
